name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native bindings
        run: |
          native_dir="$(mktemp -d)"
          trap 'rm -rf "$native_dir"' EXIT
          npm install --prefix "$native_dir" --no-save --package-lock=false \
            "@rollup/rollup-linux-x64-gnu@$(node -p 'require("./node_modules/rollup/package.json").version')" \
            "@tailwindcss/oxide-linux-x64-gnu@$(node -p 'require("./node_modules/@tailwindcss/oxide/package.json").version')" \
            "lightningcss-linux-x64-gnu@$(node -p 'require("./node_modules/lightningcss/package.json").version')"
          cp -a "$native_dir/node_modules/@rollup/rollup-linux-x64-gnu" node_modules/@rollup/
          cp -a "$native_dir/node_modules/@tailwindcss/oxide-linux-x64-gnu" node_modules/@tailwindcss/
          cp -a "$native_dir/node_modules/lightningcss-linux-x64-gnu" node_modules/

      - name: Test deployment scripts
        run: npm run test:scripts

      - name: Test application
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_APP_VERSION: dev
          VITE_APP_COMMIT: ${{ github.sha }}
        run: npm run build

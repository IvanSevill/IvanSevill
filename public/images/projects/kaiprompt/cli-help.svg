<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Kaiprompt CLI help capture</title><desc id="desc">Selected lines rendered from the actual Kaiprompt help command.</desc>
  <rect width="1400" height="820" fill="#070a0c"/><rect x="35" y="35" width="1330" height="750" rx="10" fill="#0b1114" stroke="#263a40" stroke-width="2"/>
  <circle cx="75" cy="73" r="9" fill="#ff6b6b"/><circle cx="105" cy="73" r="9" fill="#ffd166"/><circle cx="135" cy="73" r="9" fill="#39e6a5"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21"><text x="70" y="125" fill="#39e6a5">$ node kaip.mjs help</text><text x="70" y="170" fill="#eef7f4">kaip — portable prompt queue for Claude Code</text><text x="70" y="215" fill="#8fa5a0">Usage:</text><text x="95" y="250" fill="#d7e4e0">kaip                       open the guided GUI</text><text x="95" y="283" fill="#d7e4e0">kaip &lt;engine&gt; &lt;subcommand&gt; [args]</text><text x="95" y="316" fill="#8fa5a0">&lt;engine&gt; = claude | codex | opencode</text><text x="70" y="370" fill="#8fa5a0">Queue:</text><text x="95" y="405" fill="#d7e4e0">add "&lt;prompt&gt;"      queue a launch [--at &lt;when&gt;] [--target &lt;n&gt;]</text><text x="95" y="438" fill="#d7e4e0">list [--full|-f]    the queue, with status</text><text x="95" y="471" fill="#d7e4e0">retry &lt;id&gt;          put an error job back in the queue</text><text x="70" y="525" fill="#8fa5a0">Running:</text><text x="95" y="560" fill="#d7e4e0">daemon start        background runner for scheduled launches</text><text x="95" y="593" fill="#d7e4e0">run --parallel N    independent conversations can run together</text><text x="70" y="647" fill="#8fa5a0">The phone:</text><text x="95" y="682" fill="#d7e4e0">serve               local API, tunnel and pairing QR</text><text x="95" y="715" fill="#d7e4e0">mobile              Android download QR</text><text x="70" y="760" fill="#39e6a5">Scheduling is not launching.</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized personal cloud and homelab architecture</title><desc id="desc">Private clients reach container stacks through private DNS and controlled ingress, backed by SMB storage, layered monitoring and encrypted off-host recovery.</desc>
  <defs><style>.bg{fill:#070a0c}.box{fill:#0d1418;stroke:#42dda2;stroke-width:2}.soft{fill:#10171c;stroke:#68808a;stroke-width:2}.warn{fill:#17140d;stroke:#ffc85c;stroke-width:2}.line{fill:none;stroke:#42dda2;stroke-width:3}.dash{fill:none;stroke:#8ea2aa;stroke-width:2;stroke-dasharray:10 8}.h{fill:#edf7f3;font:700 24px ui-monospace,monospace}.t{fill:#b5c4bf;font:18px ui-monospace,monospace}.k{fill:#42dda2;font:700 17px ui-monospace,monospace}.w{fill:#ffc85c;font:17px ui-monospace,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#42dda2"/></marker></defs>
  <rect class="bg" width="1400" height="820"/><text class="k" x="65" y="60">PERSONAL CLOUD · PUBLIC-SAFE VIEW</text>
  <rect class="soft" x="70" y="125" width="250" height="110"/><text class="h" x="105" y="170">Private clients</text><text class="t" x="105" y="205">trusted devices</text>
  <rect class="box" x="420" y="125" width="290" height="110"/><text class="h" x="455" y="170">Private access</text><text class="t" x="455" y="205">Tailscale · private DNS</text><path class="line" d="M320 180H405" marker-end="url(#a)"/>
  <rect class="box" x="810" y="125" width="290" height="110"/><text class="h" x="845" y="170">Controlled ingress</text><text class="t" x="845" y="205">reverse proxy · hardening</text><path class="line" d="M710 180H795" marker-end="url(#a)"/>
  <rect class="box" x="810" y="355" width="400" height="155"/><text class="h" x="845" y="402">ivansevill-vm</text><text class="t" x="845" y="440">Ubuntu ARM64 · Oracle/KVM</text><text class="t" x="845" y="475">Docker Compose stacks</text><path class="line" d="M955 235V340" marker-end="url(#a)"/>
  <rect class="warn" x="70" y="370" width="330" height="135"/><text class="h" x="105" y="416">SMB-backed storage</text><text class="t" x="105" y="452">persistent service data</text><text class="w" x="105" y="482">single failure domain</text><path class="line" d="M400 438H795" marker-end="url(#a)"/>
  <rect class="soft" x="70" y="610" width="420" height="120"/><text class="h" x="105" y="654">Layered monitoring</text><text class="t" x="105" y="690">availability · host · DNS · healthchecks · Sentinel</text><path class="dash" d="M490 670H1010V525"/>
  <rect class="box" x="760" y="610" width="450" height="120"/><text class="h" x="795" y="654">Encrypted recovery</text><text class="t" x="795" y="690">Restic · off-VPS · isolated restore tested</text><path class="dash" d="M985 610V525"/>
  <text class="w" x="70" y="785">Off-host Vaultwarden backup is not presented as full 3-2-1 coverage.</text>
</svg>

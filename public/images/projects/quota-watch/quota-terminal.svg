<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic quota-watch terminal sample</title><desc id="desc">Non-sensitive synthetic values in quota-watch's documented output format.</desc>
  <rect width="1400" height="760" fill="#070a0d"/><rect x="35" y="35" width="1330" height="690" rx="10" fill="#0c1115" stroke="#2b3b42" stroke-width="2"/>
  <circle cx="75" cy="73" r="9" fill="#ff6b6b"/><circle cx="105" cy="73" r="9" fill="#ffd166"/><circle cx="135" cy="73" r="9" fill="#65dc9a"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="1150" y="82" fill="#ffd166" font-size="17" font-weight="700">SYNTHETIC DATA</text><text x="70" y="135" fill="#7ad9ff" font-size="21">$ node usage.mjs --provider claude</text><text x="70" y="188" fill="#eef7fa" font-size="24">AI quota</text><text x="95" y="235" fill="#d6e3e8" font-size="21">session   ███████████░░   84% left   resets in 2h 15m</text><text x="95" y="275" fill="#d6e3e8" font-size="21">week      ████████░░░░░   62% left   resets in 5d 8h</text><text x="70" y="345" fill="#7ad9ff" font-size="21">$ node usage.mjs --provider codex --schema</text><text x="70" y="397" fill="#d6e3e8" font-size="20">{</text><text x="100" y="434" fill="#d6e3e8" font-size="20">"provider": "codex",</text><text x="100" y="471" fill="#d6e3e8" font-size="20">"status": "available",</text><text x="100" y="508" fill="#d6e3e8" font-size="20">"limits": { "primary": { "remainingPercent": 72 } },</text><text x="100" y="545" fill="#d6e3e8" font-size="20">"source": { "kind": "app-server", "official": true, "stale": false },</text><text x="100" y="582" fill="#d6e3e8" font-size="20">"errors": []</text><text x="70" y="619" fill="#d6e3e8" font-size="20">}</text><text x="70" y="682" fill="#91a5ad" font-size="17">Values are illustrative. Shape and commands follow the implemented CLI contract.</text></g>
</svg>
